name: 🛰️ 更新免费节点

on:
  schedule:
    - cron: "17 */6 * * *"     # 每 6 小时一次（UTC），想更勤快改成 "17 */3 * * *"
  workflow_dispatch:            # 手动点 Run workflow 立即更新
  push:
    paths: [sources.txt, collector.py]

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 安装依赖
        run: pip install pyyaml

      - name: ⬇️ 下载 mihomo 内核（测速用）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/MetaCubeX/mihomo/releases/latest \
            --jq '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-v.*\\.gz$")) | .browser_download_url' | head -1)
          echo "mihomo: $url"
          curl -sSL "$url" | gunzip > mihomo
          chmod +x mihomo && ./mihomo -v

      - name: 🔍 收集 + 测速 + 生成订阅
        env:
          MAX_NODES: "200"        # 海外版最多几个
          MAX_DELAY: "3000"       # 超过这个延迟(ms)的丢掉
          MAX_CANDIDATES: "9000"  # 最多测多少个候选
          FULL_MAX: "300"         # 全部版最多几个
          US_CAP: "100"           # 全部版里美国最多几个
          ASIA_QUOTA: "HK=15,JP=15,SG=12,TW=10,KR=10,MY=5,TH=5,VN=5,IN=5,ID=5,PH=5"  # 亚洲保底名额
        run: python collector.py

      - name: 💾 提交更新
        run: |
          git config user.name  "node-bot"
          git config user.email "node-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "🛰️ 节点更新 $(date -u '+%Y-%m-%d %H:%M') · $(python -c "import json;print(json.load(open('output/stats.json'))['alive'])") 个可用"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done

      - name: 📬 Telegram 推送（可选）
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python notify.py
